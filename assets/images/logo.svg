<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- House Icon -->
  <g transform="translate(10, 8)">
    <!-- House Base -->
    <rect x="5" y="18" width="28" height="20" fill="url(#houseGradient)" stroke="#ffffff" stroke-width="2"/>
    <!-- Roof -->
    <polygon points="0,18 19,2 38,18" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <!-- Door -->
    <rect x="14" y="26" width="10" height="12" fill="#0d6efd"/>
    <!-- Window -->
    <rect x="7" y="22" width="6" height="6" fill="#0d6efd" opacity="0.7"/>
    <rect x="25" y="22" width="6" height="6" fill="#0d6efd" opacity="0.7"/>
  </g>
  
  <!-- Brand Name -->
  <text x="55" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">RealEstate</text>
</svg>
